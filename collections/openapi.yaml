openapi: 3.0.3
info:
  title: EShop SUT Backend API
  description: OpenAPI 3.0 specification for EShop Backend System Under Test (SUT) APIs tested in HW06.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development SUT
paths:
  /api/users/me:
    get:
      summary: Get current user profile
      description: Returns the authenticated user profile.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
        '403':
          description: Invalid or expired token
    put:
      summary: Update user profile
      description: Updates the authenticated user's profile details.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  pattern: '^0\d{9,10}$'
                shipping_address:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Validation error

  /api/apply-coupon:
    post:
      summary: Apply discount coupon to order
      description: Calculates discount and final total for an order using a coupon code.
      parameters:
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - total_amount
              properties:
                code:
                  type: string
                total_amount:
                  type: number
                user_id:
                  type: integer
      responses:
        '200':
          description: Coupon applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponResponse'
        '400':
          description: Invalid or non-qualifying coupon

  /api/products:
    get:
      summary: List or search products
      description: Returns product catalog list with optional search query.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create product (Admin)
      description: Creates a new product catalog item. Requires Admin role.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
      responses:
        '200':
          description: Product created successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Admin access required

  /api/products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    put:
      summary: Update product (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
      responses:
        '200':
          description: Product updated
        '404':
          description: Product not found
    delete:
      summary: Delete product (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Student-Id
          in: header
          required: true
          schema:
            type: string
            example: "23127249"
      responses:
        '200':
          description: Product deleted
        '404':
          description: Product not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        shipping_address:
          type: string
        role:
          type: string
          enum: [user, admin]
    CouponResponse:
      type: object
      properties:
        code:
          type: string
        discount_amount:
          type: number
        final_amount:
          type: number
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        category_id:
          type: integer
    ProductCreateInput:
      type: object
      required:
        - name:
        - price:
        - category_id:
      properties:
        name:
          type: string
        price:
          type: number
        category_id:
          type: integer
